server:
  port: 8082

spring:

  application:
    name: fund-transfer-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/fund_transfer_db}
    username: ${DB_USERNAME:banking_admin}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fund-transfer-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
      concurrency: 3
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 0
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

app:

  services:
      account: ${ACCOUNT_SERVICE_URL:http://account-service}
      charge-fee: ${CHARGE_FEE_SERVICE_URL:http://charge-fee-service}
      otp: ${OTP_SERVICE_URL:http://otp-service}
      cbs: ${CBS_SERVICE_URL:http://core-banking-service}
      notification: ${NOTIFICATION_SERVICE_URL:http://notification-service}
  transfer:
    pending-expiry-minutes: 10
    max-pending-per-user: 5
    notify-email: ${TRANSFER_NOTIFY_EMAIL:2227jahid@gmail.com}
    deposit-requires-otp: false
    saga-enabled: ${TRANSFER_SAGA_ENABLED:false}
  saga:
      step-timeout-seconds: 30
      max-resends: 3
      reversal-max-resends: 5
      otp-issue-timeout-seconds: 60
      otp-resend-cooldown-seconds: 30
      sweep-interval-ms: 5000
  messaging:
      producer-name: fund-transfer-service
      relay-interval-ms: 1000
  outbox:
    poll-interval-ms: 1000
    retention-days: 7
management:
  server:
    port: 18082
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
